<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Boiii Server Maker app icon.
    Source of truth for icon.png / icon.ico; regenerate them with
    assets/branding/render.py after editing this file.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2A3C"/>
      <stop offset="1" stop-color="#0A0D13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#3A86FF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#3A86FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B475E"/>
      <stop offset="1" stop-color="#232B3A"/>
    </linearGradient>
    <linearGradient id="unitTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A9BFF"/>
      <stop offset="1" stop-color="#2A6AE0"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4BE08F"/>
      <stop offset="1" stop-color="#1E9658"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#glow)"/>
  <rect x="33.5" y="33.5" width="957" height="957" rx="214.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Server stack -->
  <g filter="url(#shadow)">
    <!-- top unit: the live server -->
    <rect x="212" y="236" width="600" height="160" rx="40" fill="url(#unitTop)"/>
    <rect x="212" y="236" width="600" height="80" rx="40" fill="#FFFFFF" fill-opacity="0.10"/>
    <circle cx="300" cy="316" r="26" fill="#FFFFFF"/>
    <rect x="370" y="300" width="250" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.35"/>
    <rect x="660" y="300" width="64" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.35"/>

    <!-- middle unit -->
    <rect x="212" y="432" width="600" height="160" rx="40" fill="url(#unit)"/>
    <circle cx="300" cy="512" r="26" fill="#34C77B"/>
    <rect x="370" y="496" width="250" height="32" rx="16" fill="#8996AE" fill-opacity="0.45"/>
    <rect x="660" y="496" width="64" height="32" rx="16" fill="#8996AE" fill-opacity="0.45"/>

    <!-- bottom unit -->
    <rect x="212" y="628" width="600" height="160" rx="40" fill="url(#unit)"/>
    <circle cx="300" cy="708" r="26" fill="#34C77B"/>
    <rect x="370" y="692" width="250" height="32" rx="16" fill="#8996AE" fill-opacity="0.45"/>
  </g>

  <!-- "Start" badge -->
  <g filter="url(#shadow)">
    <circle cx="742" cy="742" r="150" fill="#0E131B"/>
    <circle cx="742" cy="742" r="124" fill="url(#badge)"/>
    <path d="M712 672 L812 742 L712 812 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="22" stroke-linejoin="round"/>
  </g>
</svg>
