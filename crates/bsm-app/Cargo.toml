[package]
name = "bsm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

# The main window (egui).
[[bin]]
name = "BoiiiServerMaker"
path = "src/main_window/main.rs"

# The earlier window built from classic Windows controls. Kept as a fallback
# for PCs whose graphics driver cannot run the main window.
[[bin]]
name = "BoiiiServerMakerClassic"
path = "src/classic.rs"

[[bin]]
name = "bsm"
path = "src/cli.rs"

[dependencies]
bsm-core = { path = "../bsm-core" }
native-windows-gui = { version = "1.0.13", default-features = false, features = [
    "combobox", "textbox", "notice", "file-dialog", "clipboard", "high-dpi", "embed-resource",
] }
eframe = { version = "0.29", default-features = false, features = ["wgpu", "glow", "default_fonts"] }
egui_extras = { version = "0.29", default-features = false, features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = { version = "0.15", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
] }

[build-dependencies]
embed-manifest = "1.4"
winresource = "0.1.34"
